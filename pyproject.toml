[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxshift"
version = "0.1.0"
description = "Free, local real-time voice changer: DSP voice graphs plus Seed-VC AI voices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = ["numpy>=1.26", "scipy>=1.13", "sounddevice>=0.5", "soundfile>=0.12"]

[project.optional-dependencies]
ai = ["torch", "torchaudio", "librosa>=0.10", "transformers==4.46.3", "huggingface_hub>=0.28,<1.0",
      "munch>=4.0", "einops>=0.8", "pyyaml>=6.0", "matplotlib>=3.8"]
onnx = ["onnx>=1.17", "onnxruntime-directml>=1.20; platform_system == 'Windows'"]
test = ["pytest>=8"]

[project.scripts]
voxshift = "voxshift.cli:main"

[tool.setuptools.packages.find]
include = ["voxshift*"]

[tool.setuptools.package-data]
voxshift = ["voices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
